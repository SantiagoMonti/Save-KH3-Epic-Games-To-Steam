    <path d="M-15 0h28m0 0-10-10m10 10L3 10" fill="none" stroke="url(#glow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#shadow)" transform="translate(1088 138) rotate(6 132 171)">
    <rect width="268" height="342" rx="24" fill="#20263d" stroke="#94aaff" stroke-opacity=".76" stroke-width="2"/>
    <rect x="22" y="22" width="224" height="122" rx="16" fill="#8496fa" fill-opacity=".12"/>
    <circle cx="134" cy="83" r="35" fill="none" stroke="#a8bbff" stroke-width="4"/>
    <path d="M105 82h19l9-11 14 23h16m-29-20v17" fill="none" stroke="#a8bbff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="24" y="188" fill="#bdc9ff" font-size="14" font-weight="700" letter-spacing="1.8">DESTINO</text>
      <text x="24" y="224" fill="#f6f7ff" font-size="22" font-weight="700">Steam</text>
      <text x="24" y="256" fill="#aeb8cb" font-size="14">Mismo espacio de guardado</text>
      <path d="M24 283h220" stroke="#ffffff" stroke-opacity=".1"/>
      <circle cx="31" cy="312" r="5" fill="#78d6bc"/>
      <text x="45" y="317" fill="#cbd6df" font-size="13">Respaldo antes de instalar</text>
    </g>
  </g>
